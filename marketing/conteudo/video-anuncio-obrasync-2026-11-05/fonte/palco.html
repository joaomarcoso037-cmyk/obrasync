<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Palco do anúncio</title>
<style>
@font-face {
  font-family: Manrope; font-weight: 200 800; font-display: block;
  src: url('http://localhost:4310/node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2') format('woff2');
}
:root { --verde: #142B29; --lima: #A3D65C; --claro: #F5F7F5; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: clip; background: var(--verde); font-family: Manrope, sans-serif; color: #fff; }
b { color: var(--lima); font-weight: 800; }

#fundo { position: absolute; inset: 0; background: radial-gradient(900px 900px at 50% 42%, #24443f 0%, var(--verde) 70%); }

#topo { position: absolute; inset: 0 0 auto 0; height: 250px; padding: 36px 54px 0; z-index: 25; }
#topo .marca { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
#topo .marca svg { width: 33px; height: 35px; }
#nota { position: absolute; top: 46px; right: 54px; font-size: 25px; font-weight: 600; color: #a9c0b8; }
#titulo { margin-top: 28px; font-size: 68px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; white-space: nowrap; }
#titulo.entra { animation: sobe .34s cubic-bezier(.2,.9,.25,1) both; }
@keyframes sobe { from { transform: translateY(34px); opacity: 0; } }

#aparelho {
  position: absolute; left: 150px; top: 250px; width: 780px; height: 1320px;
  border-radius: 40px; overflow: hidden; background: var(--claro);
  box-shadow: 0 0 0 6px #35554f, 0 40px 90px rgba(0,0,0,.45);
  transition: transform .55s cubic-bezier(.16,1.1,.3,1);
}
#aparelho.fora { transform: translateY(1700px); }
#app {
  width: 400px; height: 677px; border: 0; display: block; background: var(--claro);
  transform-origin: 0 0; transform: scale(1.95);
  transition: transform .42s cubic-bezier(.22,.8,.2,1);
}

#legenda {
  position: absolute; left: 44px; right: 44px; top: 1590px; height: 310px; z-index: 40;
  display: flex; align-items: center; justify-content: center; text-align: center;
  font-size: 50px; font-weight: 800; line-height: 1.2; letter-spacing: -0.015em; text-wrap: balance;
}
#legenda span { display: block; }
#legenda span.entra { animation: sobe .2s ease-out both; }

#dedo {
  position: absolute; left: 0; top: 0; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%;
  background: rgba(163,214,92,.6); border: 5px solid var(--verde); box-shadow: 0 0 0 3px #fff;
  opacity: 0; pointer-events: none; z-index: 22;
  transition: left .24s cubic-bezier(.3,.8,.3,1), top .24s cubic-bezier(.3,.8,.3,1), opacity .15s, transform .12s;
}
#dedo.tocando { transform: scale(.7); }
.onda { position: absolute; width: 72px; height: 72px; margin: -36px 0 0 -36px; border-radius: 50%; border: 6px solid var(--lima); pointer-events: none; z-index: 21; animation: onda .45s ease-out forwards; }
@keyframes onda { to { transform: scale(2.6); opacity: 0; } }

#anel {
  position: absolute; border: 8px solid var(--lima); border-radius: 22px; pointer-events: none; z-index: 18;
  box-shadow: 0 0 0 5px rgba(20,43,41,.75), 0 0 34px 8px rgba(163,214,92,.55);
  opacity: 0; transition: opacity .16s;
}

#cartao {
  position: absolute; inset: 0; z-index: 30; background: radial-gradient(1000px 1000px at 50% 44%, #24443f 0%, var(--verde) 72%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: 0 70px 300px; gap: 30px; transition: opacity .22s;
}
#cartao.fora { opacity: 0; pointer-events: none; }
#cartao .g { font-size: 92px; white-space: nowrap; font-weight: 800; letter-spacing: -0.035em; line-height: 1.06; animation: sobe .26s cubic-bezier(.2,.9,.25,1) both; }
#cartao .p { font-size: 112px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.08; animation: sobe .3s cubic-bezier(.2,.9,.25,1) both; }
#cartao .s { font-size: 50px; font-weight: 600; color: #cfe0d9; animation: sobe .3s .1s cubic-bezier(.2,.9,.25,1) both; }
#cartao .marca { display: flex; align-items: center; gap: 28px; font-size: 118px; font-weight: 800; letter-spacing: -0.03em; }
#cartao .marca svg { width: 128px; height: 135px; }
#cartao .batida { display: flex; flex-direction: column; align-items: center; gap: 26px; animation: batida .42s cubic-bezier(.16,1.2,.3,1) both; }
@keyframes batida { from { transform: scale(1.5); opacity: 0; } }
#cartao .assina { font-size: 46px; font-weight: 600; color: #cfe0d9; }
.passos { display: flex; flex-direction: column; gap: 18px; width: 820px; height: 354px; margin-top: 26px; }
.passos div { display: flex; align-items: center; gap: 26px; background: #1e3b37; border-radius: 22px; padding: 22px 30px; font-size: 46px; font-weight: 700; text-align: left; }
.passos i { font-style: normal; flex: none; width: 66px; height: 66px; border-radius: 50%; background: var(--lima); color: var(--verde); font-weight: 800; display: flex; align-items: center; justify-content: center; }

#corte { position: absolute; inset: 0; z-index: 28; background: var(--lima); transform: translateX(-102%); pointer-events: none; }
#corte.vai { animation: corte .44s cubic-bezier(.65,0,.35,1) forwards; }
@keyframes corte { 0% { transform: translateX(-102%); } 50% { transform: translateX(0); } 100% { transform: translateX(102%); } }
</style>
</head>
<body>
  <div id="fundo"></div>
  <header id="topo">
    <div class="marca">
      <svg viewBox="0 0 402 425" aria-hidden="true"><g fill="#A3D65C"><polygon points="217,0 400,105 400,173 217,70 63,160 63,245 2,210 2,125"/><polygon points="127,165 203,123 203,320 127,277"/><polygon points="2,250 203,365 203,425 2,310"/></g><polygon fill="#F5F7F5" points="235,130 400,223 400,305 235,400 235,335 347,263 235,195"/></svg>
      <span>Obra<b>Sync</b></span>
    </div>
    <div id="nota">Dados ilustrativos</div>
    <div id="titulo"></div>
  </header>
  <div id="aparelho" class="fora"><iframe id="app" title="ObraSync"></iframe></div>
  <div id="anel"></div>
  <div id="dedo"></div>
  <div id="corte"></div>
  <div id="cartao"></div>
  <div id="legenda"><span></span></div>
<script>
const $ = (s) => document.querySelector(s);
const MARCA = document.querySelector('#topo .marca').outerHTML;
const W = 780, H = 1320, ESCALA = 1.95, LARG = 400, ALT = 677;
const limita = (v, min, max) => Math.min(max, Math.max(min, v));
const reanima = (el, classe) => { el.classList.remove(classe); void el.offsetWidth; el.classList.add(classe); };
let someDedo;

window.T = {
  legenda(t) { const s = $('#legenda span'); s.textContent = t; reanima(s, 'entra'); },
  titulo(h) { const t = $('#titulo'); t.innerHTML = h; reanima(t, 'entra'); },
  gancho(h) { const d = document.createElement('div'); d.className = 'g'; d.innerHTML = h; $('#cartao').append(d); },
  pergunta(h) { $('#cartao').innerHTML = `<div class="p">${h}</div>`; },
  logo() { $('#cartao').innerHTML = `<div class="batida">${MARCA}<div class="assina">Gestão inteligente de obras</div></div>`; },
  fecha(h) { const c = $('#cartao'); c.classList.remove('fora'); c.innerHTML = `<div class="p">${h}</div>`; },
  sub(s) { const d = document.createElement('div'); d.className = 's'; d.textContent = s; $('#cartao').append(d); },
  chamada() {
    $('#cartao').innerHTML = `<div class="batida">${MARCA}</div><div class="p" style="font-size:72px">Seu acesso já está <b>pronto.</b></div>
      <div class="passos"></div>`;
  },
  passo(n, t) { const d = document.createElement('div'); d.style.animation = 'sobe .24s cubic-bezier(.2,.9,.25,1) both'; d.innerHTML = `<i>${n}</i>${t}`; $('.passos').append(d); },
  semCartao() { $('#cartao').classList.add('fora'); },
  aparelho() { $('#aparelho').classList.remove('fora'); },
  corte() { reanima($('#corte'), 'vai'); },
  zoom(cx, cy, s) {
    const x = limita(W / 2 - s * cx, W - s * LARG, 0);
    const y = limita(H / 2 - s * cy, H - s * ALT, 0);
    $('#app').style.transform = `translate(${x}px, ${y}px) scale(${s})`;
  },
  semZoom() { $('#app').style.transform = `scale(${ESCALA})`; },
  dedo(x, y) {
    const d = $('#dedo');
    d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.opacity = 1;
    clearTimeout(someDedo);
    someDedo = setTimeout(() => { d.style.opacity = 0; }, 900);
  },
  toque(x, y) {
    const d = $('#dedo');
    d.classList.add('tocando');
    setTimeout(() => d.classList.remove('tocando'), 140);
    const o = document.createElement('div');
    o.className = 'onda'; o.style.left = x + 'px'; o.style.top = y + 'px';
    document.body.append(o);
    setTimeout(() => o.remove(), 480);
  },
  anel(x, y, w, h) { Object.assign($('#anel').style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', opacity: 1 }); },
  semAnel() { $('#anel').style.opacity = 0; },
};
</script>
</body>
</html>
