<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Palco do tutorial</title>
<style>
@font-face {
  font-family: Manrope; font-weight: 200 800; font-display: block;
  src: url('http://localhost:4310/node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2') format('woff2');
}
:root { --verde: #142B29; --lima: #A3D65C; --claro: #F5F7F5; --grafite: #303A38; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--verde); font-family: Manrope, sans-serif; color: var(--claro); }

#topo { position: absolute; inset: 0 0 auto 0; height: 188px; padding: 34px 54px 0; }
.marca { display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
.marca svg { width: 38px; height: 40px; }
.marca b { color: var(--lima); font-weight: 800; }
#marcador { position: absolute; top: 44px; right: 54px; font-size: 28px; font-weight: 700; color: #bcd0c8; }
#etapa { margin-top: 20px; font-size: 42px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; white-space: nowrap; }
#barras { position: absolute; left: 54px; right: 54px; top: 170px; display: flex; gap: 8px; }
#barras i { flex: 1; height: 7px; border-radius: 4px; background: #33504b; }
#barras i.feito { background: var(--lima); }

#aparelho {
  position: absolute; left: 108px; top: 204px; width: 864px; height: 1450px;
  border-radius: 34px; overflow: hidden; background: var(--claro);
  box-shadow: 0 0 0 5px #2c4843;
}
#app { width: 400px; height: 671.3px; border: 0; transform: scale(2.16); transform-origin: 0 0; display: block; background: var(--claro); }

#legenda {
  position: absolute; left: 54px; right: 54px; top: 1672px; height: 232px;
  display: flex; align-items: center; justify-content: center; text-align: center;
  font-size: 45px; font-weight: 700; line-height: 1.24; letter-spacing: -0.01em; color: #fff;
  text-wrap: balance; z-index: 40;
}
#legenda span { transition: opacity .16s; }

#dedo {
  position: absolute; left: 0; top: 0; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%;
  background: rgba(163, 214, 92, .55); border: 5px solid var(--verde); box-shadow: 0 0 0 3px #fff;
  opacity: 0; pointer-events: none; z-index: 20;
  transition: left .42s cubic-bezier(.3,.8,.3,1), top .42s cubic-bezier(.3,.8,.3,1), opacity .2s, transform .14s;
}
#dedo.tocando { transform: scale(.72); }
.onda {
  position: absolute; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%;
  border: 6px solid var(--lima); pointer-events: none; z-index: 19; animation: onda .55s ease-out forwards;
}
@keyframes onda { to { transform: scale(2.6); opacity: 0; } }

#anel {
  position: absolute; border: 7px solid var(--lima); border-radius: 20px; pointer-events: none; z-index: 18;
  box-shadow: 0 0 0 5px rgba(20, 43, 41, .75), 0 0 0 4000px rgba(20, 43, 41, .28);
  opacity: 0; transition: opacity .2s; animation: pulso 1.1s ease-in-out infinite alternate;
}
@keyframes pulso { to { border-color: #d2f09c; } }

#cartao {
  position: absolute; inset: 0; z-index: 30; background: var(--verde);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: 0 80px 240px; gap: 34px; opacity: 0; pointer-events: none; transition: opacity .3s;
}
#cartao.ver { opacity: 1; }
#cartao .marca { font-size: 92px; gap: 26px; }
#cartao .marca svg { width: 100px; height: 106px; }
#cartao h1 { font-size: 72px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; }
#cartao p { font-size: 40px; font-weight: 600; color: #cfe0d9; line-height: 1.3; }
#cartao small { font-size: 36px; font-weight: 800; color: var(--lima); letter-spacing: .02em; }
</style>
</head>
<body>
  <header id="topo">
    <div class="marca">
      <svg viewBox="0 0 402 425" aria-hidden="true"><g fill="#A3D65C"><polygon points="217,0 400,105 400,173 217,70 63,160 63,245 2,210 2,125"/><polygon points="127,165 203,123 203,320 127,277"/><polygon points="2,250 203,365 203,425 2,310"/></g><polygon fill="#F5F7F5" points="235,130 400,223 400,305 235,400 235,335 347,263 235,195"/></svg>
      <span>Obra<b>Sync</b></span>
    </div>
    <div id="marcador"></div>
    <div id="etapa"></div>
    <div id="barras"></div>
  </header>

  <div id="aparelho"><iframe id="app" title="ObraSync"></iframe></div>
  <div id="legenda"><span></span></div>
  <div id="anel"></div>
  <div id="dedo"></div>
  <div id="cartao"></div>

<script>
const MARCA = document.querySelector('.marca').outerHTML;
const $ = (s) => document.querySelector(s);
let someDedo;

window.T = {
  legenda(texto) {
    const s = $('#legenda span');
    s.style.opacity = 0;
    setTimeout(() => { s.textContent = texto; s.style.opacity = 1; }, 120);
  },
  etapa(n, total, titulo = '') {
    $('#etapa').textContent = titulo;
    $('#marcador').textContent = n ? `Passo ${n} de ${total}` : '';
    $('#barras').innerHTML = Array.from({ length: total }, (_, i) => `<i class="${n && i < n ? 'feito' : ''}"></i>`).join('');
  },
  cartao(html) {
    const c = $('#cartao');
    if (html === null) { c.classList.remove('ver'); return; }
    c.innerHTML = html.replace('{marca}', MARCA);
    c.classList.add('ver');
  },
  dedo(x, y) {
    const d = $('#dedo');
    d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.opacity = 1;
    clearTimeout(someDedo);
    someDedo = setTimeout(() => { d.style.opacity = 0; }, 1500);
  },
  toque(x, y) {
    const d = $('#dedo');
    d.classList.add('tocando');
    setTimeout(() => d.classList.remove('tocando'), 170);
    const o = document.createElement('div');
    o.className = 'onda'; o.style.left = x + 'px'; o.style.top = y + 'px';
    document.body.append(o);
    setTimeout(() => o.remove(), 600);
  },
  anel(x, y, w, h) {
    const a = $('#anel');
    Object.assign(a.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', opacity: 1 });
  },
  semAnel() { $('#anel').style.opacity = 0; },
};
</script>
</body>
</html>
