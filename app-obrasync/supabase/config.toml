# Quem chama o webhook é o Asaas, que não tem login na Supabase.
# A segurança fica no token conferido dentro da função.
[functions.asaas-webhook]
verify_jwt = false

# O app chama com o login do usuário; sem login, a Supabase recusa antes de chegar na função.
[functions.assinatura]
verify_jwt = true
